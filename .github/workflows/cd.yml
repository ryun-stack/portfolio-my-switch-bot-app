name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  ACA_NAME: ${{ vars.ACA_NAME }}
  ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}

jobs:
  build-and-push-image:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository }}/api" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy-client-to-storage:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build client
        run: npm run build -w @my-switch-bot-app/client
        env:
            VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
            VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
            VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
            VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MYSWITCHBOTSERVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYSWITCHBOTSERVER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYSWITCHBOTSERVER_AZURE_SUBSCRIPTION_ID }}

      - name: Upload to Static Website
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ env.STORAGE_ACCOUNT_NAME }}" \
              --source apps/client/dist \
              --destination '$web' \
              --overwrite
            echo "URL: $(az storage account show \
              --name "${{ env.STORAGE_ACCOUNT_NAME }}" \
              --query 'primaryEndpoints.web' -o tsv)"

  deploy-to-aca:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MYSWITCHBOTSERVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYSWITCHBOTSERVER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYSWITCHBOTSERVER_AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp ingress enable \
              --name "${{ env.ACA_NAME }}" \
              --resource-group "${{ env.ACA_RESOURCE_GROUP }}" \
              --type external \
              --target-port 3000 \
              --transport http
            az containerapp update \
              --name "${{ env.ACA_NAME }}" \
              --resource-group "${{ env.ACA_RESOURCE_GROUP }}" \
              --image "${{ needs.build-and-push-image.outputs.image }}:${{ needs.build-and-push-image.outputs.tag }}"
            echo "URL: https://$(az containerapp show \
              --name "${{ env.ACA_NAME }}" \
              --resource-group "${{ env.ACA_RESOURCE_GROUP }}" \
              --query 'properties.configuration.ingress.fqdn' -o tsv)"